### configure Tmux Plugin Manager
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "${HOME}/.tmux/plugins"

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

set -g @plugin 'tmux-plugins/tpm'

# basic plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# theme / style
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix + space
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'minhdanh/tmux-network-speed'

# tooling
set -g @plugin 'omerxx/tmux-sessionx'          # prefix + o
set -g @plugin 'tmux-plugins/tmux-resurrect'

### configure plugins

### https://github.com/catppuccin/tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'custom'
set -gq @catppuccin_window_middle_separator " "
set -gq @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -gq @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
# set -gq @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
# set -gq @catppuccin_window_middle_separator " "
# set -gq @catppuccin_window_middle_separator " #[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]"
# set -gq @catppuccin_window_current_middle_separator \
#   " #[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]"
# set -gq @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_text '#W'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_date_time_text_bg '#{E:@thm_sapphire}'
set -g @catppuccin_status_date_time_text_fg '#{E:@thm_black}'
set -g @catppuccin_date_time_text '%m-%d %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -g @catppuccin_status_right_separator " "
set -g @network_speed_download_color '#[fg=#{E:@thm_black}]'
set -g @network_speed_upload_color '#[fg=#{E:@thm_black}]'

# source the plugin here
run '${TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# load custom moudules
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/ctp_cpu.conf'
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/ctp_memory.conf'
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/primary_ip.conf'
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/network_speed.conf'

# set left and right status bar
set -g allow-rename off
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_network_speed}'
set -agF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
if 'test -r /sys/class/power_supply/BAT*' {
  set -agF status-right '#{E:@catppuccin_status_battery}'
}
set -ag status-right '#{E:@catppuccin_status_date_time}'

### general config

# set ctrl-a as second prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on

# enable 256-colors
set -g default-terminal 'screen-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

# turn off tmux mouse mode
set -g mouse off

set -g default-command /bin/zsh

# initialize tmux plugin manager and source all plugins
run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
