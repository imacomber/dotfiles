%hidden MODULE_NAME='network_speed'

set -ogqF "@catppuccin_${MODULE_NAME}_color" '#{E:@thm_flamingo}'
set -ogqF "@catppuccin_status_${MODULE_NAME}_text_bg" '#{E:@thm_flamingo}'
set -gF "@catppuccin_status_${MODULE_NAME}_text_fg" '#{E:@thm_black}'
set -ogq "@catppuccin_${MODULE_NAME}_text" '#{l:#{network_speed}} '

source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'
